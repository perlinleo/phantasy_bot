name: Bug report
description: Report a reproducible, sanitized problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, `.env`, databases, private URLs, Telegram IDs, user input, or generated media."
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
